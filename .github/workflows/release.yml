# Release pipeline for xthread-agent.
#
# Triggered by pushing a v* tag. Deterministic and offline (the test job
# never touches live endpoints, same politeness constraint as CI).
#
# PyPI publishing uses Trusted Publishing (OIDC) — no tokens stored in the
# repo. One-time setup (repo owner): on pypi.org → project "xthread-agent"
# (or the "pending publisher" placeholder) → Add a pending publisher:
#   owner: Bilal140202   repository: xthread-agent   workflow: release.yml
#   environment: pypi
# Until that exists, the publish job fails harmlessly after the artifacts
# are attached to the GitHub Release. See PUBLISHING.md for the checklist.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # attach artifacts to the GitHub Release
  id-token: write        # Trusted Publishing (PyPI OIDC)

jobs:
  test:
    name: Offline test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package sync check (wheel copy == source of truth)
        run: python3 scripts/sync_package.py --check
      - name: Version consistency (pyproject == tool)
        run: python3 -m unittest tests.test_package_sync -v
      - name: Offline test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python3 -m pip install --upgrade build twine
          python3 -m build
          python3 -m twine check dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          python3 -m venv /tmp/wheel_smoke
          /tmp/wheel_smoke/bin/pip install --quiet dist/*.whl
          /tmp/wheel_smoke/bin/xthread-agent --version
          /tmp/wheel_smoke/bin/python -m xthread_agent --version
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  github-release:
    name: Attach artifacts to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: RELEASE_NOTES.md

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xthread-agent/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
